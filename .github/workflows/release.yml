name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install target (non-cross only)
        if: ${{ !matrix.use_cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Install ALSA dependencies
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libssl-dev

      - name: Install Cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --target ${{ matrix.target }} --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neurokaraoke-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/neurokaraoke-desktop${{ runner.os == 'Windows' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get Tag / Input Message
        id: tag_message
        run: |
          # 💡 Dynamically determine the tag name (handle push vs manual dispatch)
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          
          # Fetch the tag contents
          MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME")
          
          # Fallback message if tag isn't annotated or it's run manually without a git tag description
          if [ -z "$MESSAGE" ]; then
            MESSAGE="Automated release for version $TAG_NAME"
          fi

          echo "note<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.tag_message.outputs.note }}
          files: artifacts/**/*
          draft: false
          prerelease: true