[package]
name = "neurokaraoke-desktop"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
winresource = "0.1.31"

[dependencies]
tokio = { version = "1.53.1", features = ["full"]}
eframe = "0.35.0"
egui_extras = { version = "*", features = ["image", "http"] }
image = { version = "0.25", features = ["png"] }
rodio = { version = "0.22.2", features = ["default"] }
url = "2.5.8"
uuid = "1.24.0"
reqwest = { version = "0.13.4", features = ["json"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_with = "3.21.0"
dashmap = { version = "7.0.0-rc2", features = ["serde"] }
anyhow = "1.0.104"
ron = "0.12.2"
dirs = "6.0.0"