[package]
name = "neurokaraoke-desktop"
version = "0.4.1"
edition = "2024"


[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
#codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = true

[build-dependencies]
winresource = "0.1.31"
# Lazy font assets: gzip the Noto .ttf files at max level (see `compress_fonts`).
# The zlib backend matches `gzip -9` output, which beats the default Rust backend.
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }

[dependencies]
mimalloc = "0.1.52"

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
eframe = "=0.36"
egui_extras = { version = "0.36", features = [ "file", "image", "http", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# magnum wasn't working, but OMG THIS GOT MERGED https://github.com/RustAudio/rodio/pull/851
rodio = { git = "https://github.com/RustAudio/rodio", rev = "4aa22e8", features = ["default", "playback", "symphonia-libopus"] }
uuid = { version = "1.26", features = ["serde", "v4", "v5"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "blocking", "multipart"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_with = "3.24"
dashmap = { version = "7.0.0-rc2", features = ["serde"] }
anyhow = "1.0"
# Media Controls
playwire = "2.0"
ron = "0.12"
dirs = "7.0"
urlencoding = "2.1"
open = "5.4"
url = "2.5"
base64 = "0.23"
chrono = "0.4"
presenceforge = { version = "0.3", features = ["tokio-runtime"] }
futures-util = "0.3"
tray-icon = { version = "0.26", features = ["ksni"] }
fs2 = "0.4"
# Lazy font loading: decompress embedded .ttf.gz on demand
flate2 = "1.0"
