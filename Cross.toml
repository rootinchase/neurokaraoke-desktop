[build]
# Ensure we use Docker
pre-build = []

[target.aarch64-unknown-linux-gnu]
# Install ARM-specific development libraries
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y libasound2-dev:arm64 pkg-config libssl-dev:arm64 libgtk-3-dev:arm64 libglib2.0-dev:arm64"
]