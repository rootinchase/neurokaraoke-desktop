[build]
# Ensure we use Docker
pre-build = []

[target.aarch64-unknown-linux-gnu]
# Install ARM-specific development libraries
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y libasound2-dev:arm64",
    "apt-get install -y pkg-config",
    "apt-get install -y libssl-dev:arm64",
    "apt-get install -y libgtk-3-dev:arm64",
    "apt-get install -y libglib2.0-dev:arm64"
]